name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Decode keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/release.jks
          if [ ! -s app/release.jks ]; then
            echo "ERROR: Keystore file is empty — check RELEASE_KEYSTORE secret"
            exit 1
          fi
          echo "Keystore decoded: $(wc -c < app/release.jks) bytes"

      - name: Build release AAB
        run: bundle exec fastlane build_release
        env:
          STORE_FILE: ${{ github.workspace }}/app/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Real AdMob IDs (falls back to Google test IDs if a secret is unset)
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
          ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_UNIT_ID }}
          ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}

      - name: Generate release notes
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ github.ref_name }}" --jq .body)
          DELIM="NOTES_EOF_$(date +%s%N)"
          {
            echo "body<<$DELIM"
            echo "$BODY"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/bundle/universalRelease/*.aab
          body: ${{ steps.notes.outputs.body }}

      # Upload to Play Console internal track — runs only when the Play service
      # account secret is configured, so a release still succeeds without it.
      - name: Check Play credentials
        id: play_check
        env:
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if echo "$PLAY_SA" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "PLAY_SERVICE_ACCOUNT_JSON is missing or not valid JSON — skipping Play upload"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode Play service account
        if: steps.play_check.outputs.enabled == 'true'
        env:
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_SA" > play-store-credentials.json

      - name: Upload to Play Store (Internal Testing)
        if: steps.play_check.outputs.enabled == 'true'
        run: bundle exec fastlane upload_internal
        env:
          PLAY_KEY_FILE: play-store-credentials.json

      - name: Upload store listing (screenshots & feature graphic)
        if: steps.play_check.outputs.enabled == 'true'
        run: bundle exec fastlane upload_metadata
        env:
          PLAY_KEY_FILE: play-store-credentials.json

      - name: Update docs changelog
        env:
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DATE=$(date -u +%Y-%m-%d)
          {
            echo "## v$VERSION - $DATE"
            echo
            echo "$NOTES"
            echo
          } > /tmp/changelog-entry.md

          git fetch origin main
          git checkout main

          awk '
            /<!-- changelog:start -->/ { print; while ((getline line < "/tmp/changelog-entry.md") > 0) print line; next }
            { print }
          ' docs/docs/changelog.md > /tmp/changelog.md
          mv /tmp/changelog.md docs/docs/changelog.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/docs/changelog.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: changelog for $GITHUB_REF_NAME"
            git push origin HEAD:main
          fi
