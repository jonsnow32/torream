name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Run unit tests
        run: ./gradlew testArm64DebugUnitTest

      - name: Generate lint baseline if missing
        if: ${{ !hashFiles('app/lint-baseline.xml') }}
        run: |
          ./gradlew updateLintBaselineArm64Debug || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lint-baseline.xml
          git commit -m "ci: add lint baseline [skip ci]" && git push || true

      - name: Run lint
        run: ./gradlew lintArm64Debug

      - name: Build debug APK
        run: ./gradlew assembleArm64Debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/arm64/debug/*.apk
          retention-days: 7
