name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Generate lint baseline if missing
        if: ${{ !hashFiles('app/lint-baseline.xml') }}
        run: |
          ./gradlew updateLintBaselineArm64Debug || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lint-baseline.xml
          git commit -m "ci: add lint baseline [skip ci]" && git push || true

      - name: Run tests and lint
        run: bundle exec fastlane test

      - name: Build debug APK
        run: bundle exec fastlane build_debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/arm64/debug/*.apk
          retention-days: 7
